services:
  service1:
    build:
      context: ./service1
    ports:
      - "8199:8199"
    depends_on:
      - service2
      - storage
    volumes:
      - ./vstorage:/vstorage
    
  service2:
    build:
      context: ./service2
    depends_on:
      - storage
    volumes:
      - ./vstorage:/vstorage
  
  storage:
    build:
      context: ./storage
    volumes:
      - ./vstorage:/vstorage

volumes:
  vstorage: